[project]
name = "deep-researcher"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "ag-ui-langgraph>=0.0.42",
    "aioboto3>=15.5.0",
    "copilotkit>=0.1.94",
    "ddgs>=9.14.4",
    "dotenv>=0.9.9",
    "fastapi[standard]>=0.138.2",
    "fs>=2.4.16",
    "httpx>=0.28.1",
    "langchain-community<0.4.2",
    "langchain-exa>=1.1.0",
    "langchain-mcp-adapters>=0.3.0",
    "langchain-tavily>=0.2.18",
    "langchain[google-genai,openai]>=1.3.11",
    "langfuse>=4.12.0",
    "langgraph>=1.2.7",
    "langgraph-checkpoint-postgres>=3.1.2",
    "llm-guard>=0.3.16",
    "ragas>=0.4.3",
    # Capped below 81: newer setuptools drops the bundled pkg_resources
    # shim, and `fs` (PyFilesystem2, 2.4.16 — no newer release exists)
    # hard-requires it at import time (fs/__init__.py does
    # `__import__("pkg_resources").declare_namespace(...)`), so anything
    # >=81 breaks app/core/services/file_system.py. The GHSA-h35f-9h28-mq5c
    # / PYSEC-2026-3447 CVEs this leaves unpatched are sdist MANIFEST.in
    # exclusion-bypass bugs relevant to *building* sdists, not to
    # installing/using already-published dependencies — low relevance here.
    "setuptools<81",
    "supabase>=2.31.0",
]

[tool.uv]
constraint-dependencies = [
    "aiohttp>=3.14.3",
]

[dependency-groups]
dev = [
    "pre-commit>=4.6.0",
    "ruff>=0.15.20",
]

[tool.uv.workspace]
members = [
    "mcp",
]
