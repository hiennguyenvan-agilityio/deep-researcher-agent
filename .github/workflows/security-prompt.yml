name: Security Prompt
on:
  pull_request:
    paths: ['app/core/prompts/**','tests/test_prompt_safety.py']
  push:
    branches: [main]

jobs:
  security-prompt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install dependencies
        run: pip install llm-guard
      - name: Check llm guard 
        run: python tests/test_prompt_safety.py
