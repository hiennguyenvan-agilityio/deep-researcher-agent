name: Security Eval Gate v3
on:
  pull_request:
    paths: ['app/core/langgraph/**','policies/**','mcp/**','app/core/prompts/**','tests/**']
  push:
    branches: [main]

jobs:
  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv package
        run: pip install uv
      - name: Install dependencies
        run: uv sync
      - name: run audit
        run: uv audit
      - name: pip-audit — fail on known CVEs (LLM03 / ASI04)
        run: pip install pip-audit && pip-audit .

  security-gate:
    needs: supply-chain
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install eval dependencies
        run: pip install agentdojo giskard deepeval
      - name: Run AgentDojo — standard suites
        run: |
          python -m agentdojo.scripts.benchmark             --suite injection,tool_misuse,exfiltration,mcp_injection             --output tests/agentdojo_standard.json
